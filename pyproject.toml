[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dlip_plasticc"
version = "0.1.0"
description = "Deep learning extensions for PLAsTiCC on top of avocado"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "pandas",
    "matplotlib",
    "h5py",
    "tables",       
    "torch",
    "scikit-learn",
    "tqdm",
    "tomli",
]

[project.optional-dependencies]
dev = [
    "jupyter",
    "ipykernel",
    "ipywidgets",    
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]